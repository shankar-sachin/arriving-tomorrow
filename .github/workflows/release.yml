name: Release

# Push a tag like v1.1.0 → publishes a GitHub release titled "arriving tomorrow v1.2.0",
# with that version's section of CHANGELOG.md followed by GitHub's generated PR list.
# Releases created on github.com keep their notes; empty ones get the same title and notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md section for $version" >&2; exit 1; fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          title="arriving tomorrow $GITHUB_REF_NAME"
          # Creating a release on github.com also pushes its tag and lands here. Notes written there
          # are kept as they are; an empty release gets the changelog section plus the PR list.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            body="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
            if [ -n "$(printf %s "$body" | tr -d '[:space:]')" ]; then
              echo "Release already has notes; leaving them alone."
              exit 0
            fi
            echo >> notes.md
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body >> notes.md
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$title" \
              --notes-file notes.md --generate-notes --verify-tag $prerelease
          fi
