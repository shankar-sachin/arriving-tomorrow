name: Release

# Push a tag like v1.1.0 → publishes a GitHub release titled "Clothes Never Come v1.1.0",
# with that version's section of CHANGELOG.md followed by GitHub's generated PR list.
# Releases created on github.com get the same title and changelog notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md section for $version" >&2; exit 1; fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          title="Clothes Never Come $GITHUB_REF_NAME"
          # Creating a release on github.com also pushes its tag and lands here. In that case the
          # release already exists, so just give it the standard title and the changelog notes.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$title" \
              --notes-file notes.md --generate-notes --verify-tag $prerelease
          fi
